spring:
  application:
    name: agentic-engineering-platform
  datasource:
    # File-based H2 so workflow state survives an application restart. Low-memory friendly.
    url: jdbc:h2:file:./data/agenticdb;AUTO_SERVER=FALSE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  tomcat:
    threads:
      max: 20
      min-spare: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.agentic: INFO

shortener:
  base-url: http://localhost:8080
  code-length: 7
  max-code-attempts: 5
  block-private-hosts: true

agentic:
  orchestration:
    parallelism: 2            # keep small on low-memory machines
  retry:
    max-retries: 3
    initial-backoff-ms: 200
    multiplier: 2.0
    max-backoff-ms: 5000
    fallback-enabled: true
  llm:
    provider: mock            # mock | openai (openai is disabled by default and unverified)
    mock:
      delay-ms: 0
      failure-probability: 0.0   # e.g. 0.2 to see random transient failures + retries
      seed: 42
      fault-injection-enabled: true
    openai:
      enabled: false
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
  workspace:
    root: ./workspace
  recovery:
    auto-resume: false
  security:
    users:
      - username: engineer
        password: ${AGENTIC_ENGINEER_PASSWORD:engineer123}
        roles: [ENGINEER]
      - username: approver
        password: ${AGENTIC_APPROVER_PASSWORD:approver123}
        roles: [ENGINEER, APPROVER]
      - username: admin
        password: ${AGENTIC_ADMIN_PASSWORD:admin123}
        roles: [ENGINEER, APPROVER, ADMIN]
